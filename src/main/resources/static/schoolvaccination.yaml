# Similarly expand for VaccinationCenter, VaccinationSchedule, VaccinationRecord, Registration, FrontLiner, FrontLinerCategory, Student
# Due to length limits, will continue expanding these properly below in following steps.

components:
  schemas:
    VaccineInfo:
      type: object
      properties:
        vaccineId:
          type: integer
        vaccineName:
          type: string
        vaccineInfo:
          type: string
    VaccinationCenter:
      type: object
      properties:
        centerId:
          type: integer
        vaccinationCenter:
          type: string
        address:
          type: string
        contactNumber:
          type: string
        longitude:
          type: number
          format: double
        latitude:
          type: number
          format: double
        status:
          type: string
    VaccinationSchedule:
      type: object
      properties:
        scheduleId:
          type: integer
        date:
          type: string
          format: date
        timeStart:
          type: string
          format: time
        timeEnd:
          type: string
          format: time
        vaccinationCenterId:
          type: integer
        vaccineInfoId:
          type: integer
        slotsAvailable:
          type: integer
    VaccinationRecord:
      type: object
      properties:
        recordId:
          type: integer
        registrationId:
          type: integer
        vaccineInfoId:
          type: integer
        firstDoseDate:
          type: string
          format: date
        secondDoseDate:
          type: string
          format: date
        boosterDoseDate:
          type: string
          format: date
        vaccineBooster:
          type: boolean
        frontLinerId:
          type: integer
        doctorComments:
          type: string
        patientFeelings:
          type: string
        remarks:
          type: string
    Registration:
      type: object
      properties:
        registrationId:
          type: integer
        firstName:
          type: string
        lastName:
          type: string
        middleName:
          type: string
        contact:
          type: string
        email:
          type: string
        dob:
          type: string
          format: date
        username:
          type: string
        password:
          type: string
        status:
          type: string
    FrontLiner:
      type: object
      properties:
        frontLinerId:
          type: integer
        completeName:
          type: string
        frontLinerCategoryId:
          type: integer
        contact:
          type: string
        email:
          type: string
        facebookAccount:
          type: string
    FrontLinerCategory:
      type: object
      properties:
        categoryId:
          type: integer
        categoryName:
          type: string
        jobDescription:
          type: string
    Student:
      type: object
      properties:
        studentId:
          type: integer
        fullName:
          type: string
        dob:
          type: string
          format: date
        gender:
          type: string
        className:
          type: string
        section:
          type: string
        rollNumber:
          type: integer
        contactInfo:
          type: string
        vaccinated:
          type: boolean
        vaccinationRecordId:
          type: integer
