paths:
  /vaccine-info:
    get:
      tags: [VaccineInfo]
      summary: Get all vaccine information
      description: Retrieve a list of vaccine information.
      operationId: getAllVaccineInfo
      responses:
        '200':
          description: Successful retrieval
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VaccineInfo'
              examples:
                Example1:
                  externalValue: './schoolvaccination-example.json#/VaccineInfo/get/0'
                Example2:
                  externalValue: './schoolvaccination-example.json#/VaccineInfo/get/1'
    post:
      tags: [VaccineInfo]
      summary: Create vaccine information
      description: Add a new vaccine information entry.
      operationId: createVaccineInfo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VaccineInfo'
            examples:
              Example1:
                externalValue: './schoolvaccination-example.json#/VaccineInfo/post/0'
              Example2:
                externalValue: './schoolvaccination-example.json#/VaccineInfo/post/1'
      responses:
        '201':
          description: Created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VaccineInfo'

