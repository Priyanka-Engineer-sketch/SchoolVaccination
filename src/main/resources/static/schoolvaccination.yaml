openapi: 3.0.3
info:
  title: School Vaccination Portal API
  description: Full OpenAPI specification for all entities
  version: 1.0.0
servers:
  - url: http://localhost:8080/api

externalDocs:
  description: Examples file
  url: ./schoolvaccination-example.json

tags:
  - name: VaccineInfo
  - name: VaccinationCenter
  - name: VaccinationSchedule
  - name: VaccinationRecord
  - name: Registration
  - name: FrontLiner
  - name: FrontLinerCategory
